name: Build & Release

on:
  push:
    branches:
      - feature/standalone
      - bookstack-migrate
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
      - feature/standalone

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-cov
      
      - name: Lint with pylint
        run: |
          python -m pylint bookstack_migrate.py --disable=all --enable=syntax-error || true
      
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=bookstack_migrate --cov-report=term-missing --cov-report=xml
      
      - name: Test package build
        run: |
          python -m build
      
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml

  build-binaries:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build standalone binary
        shell: bash
        run: |
          set -e
          OS="${{ runner.os }}"
          ARCH="$(uname -m 2>/dev/null || echo unknown)"
          BIN_NAME="bookstack-migrate-linux"
          OUT_PATH="dist/bookstack-migrate-linux"

          if [ "$OS" = "Windows" ]; then
            BIN_NAME="bookstack-migrate-windows"
            OUT_PATH="dist/bookstack-migrate-windows.exe"
          elif [ "$OS" = "macOS" ]; then
            if [ "$ARCH" = "arm64" ]; then
              BIN_NAME="bookstack-migrate-macos-arm64"
              OUT_PATH="dist/bookstack-migrate-macos-arm64"
            else
              BIN_NAME="bookstack-migrate-macos"
              OUT_PATH="dist/bookstack-migrate-macos"
            fi
          fi

          python -m PyInstaller \
            --onefile \
            --name "$BIN_NAME" \
            --distpath dist \
            --workpath build/pybuild \
            --specpath build/specs \
            --noupx \
            bookstack_migrate.py

          if [ -f "$OUT_PATH" ]; then
            echo "Built: $OUT_PATH"
          else
            echo "Expected binary not found: $OUT_PATH" >&2
            ls -la dist || true
            exit 1
          fi
      
      - name: Test standalone binary
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/bookstack-migrate-windows.exe version
            ./dist/bookstack-migrate-windows.exe help | head -10
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              ./dist/bookstack-migrate-macos-arm64 version
              ./dist/bookstack-migrate-macos-arm64 help | head -10
            else
              ./dist/bookstack-migrate-macos version
              ./dist/bookstack-migrate-macos help | head -10
            fi
          else
            ./dist/bookstack-migrate-linux version
            ./dist/bookstack-migrate-linux help | head -10
          fi
      
      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.os }}
          path: dist/

  build-package:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      
      - name: Build package
        run: python -m build
      
      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: packages
          path: dist/

  release:
    needs: [test, build-binaries, build-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/bookstack-migrate-*
            **/bookstack_migrate-*.whl
            **/bookstack_migrate-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-integration-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Start services
        run: |
          docker-compose up -d
          sleep 30
      
      - name: Check services
        run: |
          curl -f http://localhost:8000 || echo "BookStack not ready"
          curl -f http://localhost:8080 || echo "DokuWiki not ready"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run integration tests
        run: |
          python bookstack_migrate.py detect || true
          python bookstack_migrate.py version
      
      - name: Cleanup
        if: always()
        run: docker-compose down
