name: Deploy BookStack to Demo EC2

on:
  push:
    branches:
      - implement-custom-notification-for-slack-app # Your specific branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/bookstack-demo
            
            # Update the code from the specific branch
            git fetch origin
            git checkout implement-custom-notification-for-slack-app
            git pull origin implement-custom-notification-for-slack-app
            
            # Restart and Rebuild the containers to apply changes
            docker-compose up -d --build
            
            # Fix the "dubious ownership" git issue inside the container
            docker exec -u root bookstack-demo_app_1 git config --global --add safe.directory /app
