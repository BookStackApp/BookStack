name: Build & Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      
      - name: Install
        run: pip install -e .
      
      - name: Test CLI
        run: python bookstack-migrate version
      
      - name: Run Tests
        run: python -m pytest tests/ -v || true
      
      - name: Build Package
        run: |
          pip install build
          python -m build

  docker-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker
        run: docker-compose version
      
      - name: Integration Tests
        run: bash standalone/build/docker-test.sh || true
