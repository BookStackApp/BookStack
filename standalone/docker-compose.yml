version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstack_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  dokuwiki:
    image: linuxserver/dokuwiki
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/doku.php"]
      interval: 10s
      timeout: 5s
      retries: 5
