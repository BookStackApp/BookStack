volumes:
  bookstack_dev_db: {}

services:
  fake-oidc:
    image: php:8.3-cli-alpine
    working_dir: /srv
    command: php -S 0.0.0.0:9000 -t /srv /srv/router.php
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://fake-oidc:9000}
      OIDC_PUBLIC_BASE: ${OIDC_PUBLIC_BASE:-http://localhost:9091}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-fake-bookstack-client}
      FAKE_OIDC_EMAIL: ${FAKE_OIDC_EMAIL:-fake.user@example.com}
      FAKE_OIDC_NAME: ${FAKE_OIDC_NAME:-Fake OIDC User}
      FAKE_OIDC_SUB: ${FAKE_OIDC_SUB:-fake-oidc-user-001}
      FAKE_OIDC_USERNAME: ${FAKE_OIDC_USERNAME:-fake.user}
      FAKE_OIDC_GROUPS: ${FAKE_OIDC_GROUPS:-bookstack-users}
    volumes:
      - ./dev/docker/fake-oidc:/srv
    ports:
      - ${FAKE_OIDC_PORT:-9091}:9000

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bookstack-dev}
      MYSQL_USER: ${DB_USERNAME:-bookstack-test}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookstack-test}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - ./dev/docker/init.db:/docker-entrypoint-initdb.d
      - bookstack_dev_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: ./dev/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bookstack-dev}
      DB_USERNAME: ${DB_USERNAME:-bookstack-test}
      DB_PASSWORD: ${DB_PASSWORD:-bookstack-test}
      TEST_DATABASE_URL: mysql://${DB_USERNAME:-bookstack-test}:${DB_PASSWORD:-bookstack-test}@db/${TEST_DB_DATABASE:-bookstack-test}
      MAIL_DRIVER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AUTH_METHOD: ${AUTH_METHOD:-standard}
      AUTH_METHODS: ${AUTH_METHODS:-standard,oidc}
      AUTH_PRIMARY_METHOD: ${AUTH_PRIMARY_METHOD:-oidc}
      OIDC_NAME: ${OIDC_NAME:-Fake OIDC}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-fake-bookstack-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-fake-bookstack-secret}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://fake-oidc:9000}
      OIDC_ISSUER_DISCOVER: ${OIDC_ISSUER_DISCOVER:-false}
      OIDC_PUBLIC_KEY: ${OIDC_PUBLIC_KEY:-file:///app/dev/docker/fake-oidc/public.pem}
      OIDC_AUTH_ENDPOINT: ${OIDC_AUTH_ENDPOINT:-http://localhost:9091/authorize}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://fake-oidc:9000/token}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-http://fake-oidc:9000/userinfo}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-http://localhost:9091/logout}
      OIDC_ADDITIONAL_SCOPES: ${OIDC_ADDITIONAL_SCOPES:-}
    ports:
      - ${DEV_PORT:-8080}:80
    volumes:
      - ./:/app
      - ./dev/docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    entrypoint: /app/dev/docker/entrypoint.app.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node:
    image: node:22-alpine
    working_dir: /app
    user: node
    volumes:
      - ./:/app
    entrypoint: /app/dev/docker/entrypoint.node.sh

  mailhog:
    image: mailhog/mailhog
    ports:
      - ${DEV_MAIL_PORT:-8025}:8025
