[package]
name = "bookstack-to-dokuwiki"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bookstack-to-dokuwiki"
path = "src/main.rs"

[dependencies]
mysql = "25.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sha2 = "0.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
flate2 = "1.0"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
